services:
  - type: web
    name: vigilpay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: PYTHON_ANALYSIS_HOST
        fromService:
          name: vigilpay-python-risk
          type: web
          property: host
      - key: PYTHON_ANALYSIS_PORT
        fromService:
          name: vigilpay-python-risk
          type: web
          property: port
  - type: web
    name: vigilpay-python-risk
    runtime: python
    plan: free
    rootDir: services/python-risk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
