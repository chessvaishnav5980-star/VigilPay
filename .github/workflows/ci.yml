name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pip install -r requirements.txt
      - name: Engine tests
        run: python tests/test_engine.py
      - name: Build and run Java UPI ID checker
        run: cd tools/java && javac UpiIdChecker.java && java UpiIdChecker shop@paytm
      - name: Build and run C++ red-flag scanner
        run: cd tools/cpp && g++ -O2 -std=c++17 -o redflag_scanner redflag_scanner.cpp && echo "share your otp now" | ./redflag_scanner
